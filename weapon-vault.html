<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weapon Vault</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700;800&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef0f3;
    --surface:#ffffff;
    --surface-2:#f5f6f8;
    --text:#1a1e24;
    --text-dim:#5c6572;
    --text-faint:#8790a0;
    --border:#dbdfe4;
    --border-strong:#c3c9d1;
    --accent:#a8701c;
    --accent-ink:#ffffff;
    --accent-soft:#f4e6cf;
    --shadow:0 1px 2px rgba(20,24,30,.06);

    --el-kinetic:#7c8290;
    --el-arc:#1ca9d6;
    --el-solar:#e0501f;
    --el-void:#8248d6;
    --el-stasis:#3877c9;
    --el-strand:#5f9c1f;

    --gr-s:#b8331f;
    --gr-a:#c06a1f;
    --gr-b:#a3831f;
    --gr-c:#5f6b74;
    --gr-d:#345f82;
    --gr-e:#274a68;
    --gr-f:#1c3247;

    --tier-basic:#c0392b;
    --tier-basic-ink:#ffffff;
    --tier-good:#b58900;
    --tier-good-ink:#1a1305;
    --tier-god:#2e7d32;
    --tier-god-ink:#ffffff;

    --pop-1:#b8860b;
    --pop-2:#8a94a3;
    --pop-3:#a15c2e;

    --radius-sm:6px;
    --radius-md:10px;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12151a;
      --surface:#1a1e25;
      --surface-2:#20252d;
      --text:#e9ebef;
      --text-dim:#9aa3b1;
      --text-faint:#6b7382;
      --border:#2a2f38;
      --border-strong:#3a4049;
      --accent:#e3a13d;
      --accent-ink:#1a1305;
      --accent-soft:#3a2e15;
      --shadow:0 1px 2px rgba(0,0,0,.4);

      --el-kinetic:#a7adb9;
      --el-arc:#4fd7ff;
      --el-solar:#ff7a3d;
      --el-void:#a887f5;
      --el-stasis:#6fb3ff;
      --el-strand:#9ad14f;

      --tier-basic:#e5584a;
      --tier-basic-ink:#1a0503;
      --tier-good:#e3b93a;
      --tier-good-ink:#1a1305;
      --tier-god:#4fae54;
      --tier-god-ink:#041405;

      --pop-1:#e0b23e;
      --pop-2:#aeb8c4;
      --pop-3:#d08a52;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12151a;
    --surface:#1a1e25;
    --surface-2:#20252d;
    --text:#e9ebef;
    --text-dim:#9aa3b1;
    --text-faint:#6b7382;
    --border:#2a2f38;
    --border-strong:#3a4049;
    --accent:#e3a13d;
    --accent-ink:#1a1305;
    --accent-soft:#3a2e15;
    --shadow:0 1px 2px rgba(0,0,0,.4);

    --el-kinetic:#a7adb9;
    --el-arc:#4fd7ff;
    --el-solar:#ff7a3d;
    --el-void:#a887f5;
    --el-stasis:#6fb3ff;
    --el-strand:#9ad14f;

    --tier-basic:#e5584a;
    --tier-basic-ink:#1a0503;
    --tier-good:#e3b93a;
    --tier-good-ink:#1a1305;
    --tier-god:#4fae54;
    --tier-god-ink:#041405;

    --pop-1:#e0b23e;
    --pop-2:#aeb8c4;
    --pop-3:#d08a52;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Work Sans",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-soft);}

  .eyebrow{
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--text-faint);
  }

  header.top{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--bg);
    border-bottom:1px solid var(--border);
    padding:16px 18px 12px;
  }
  .top-inner{
    max-width:760px;
    margin:0 auto;
  }
  .title-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  h1{
    font-family:"Big Shoulders","Work Sans",sans-serif;
    font-weight:800;
    font-size:30px;
    letter-spacing:.01em;
    margin:2px 0 0;
    text-wrap:balance;
  }
  .sync-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;
    color:var(--text-dim);
    padding:4px 9px;
    border:1px solid var(--border);
    border-radius:999px;
    background:var(--surface);
    white-space:nowrap;
  }
  .sync-dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--text-faint);
    flex:none;
  }
  .sync-pill[data-state="synced"] .sync-dot{background:var(--el-strand);}
  .sync-pill[data-state="syncing"] .sync-dot{background:var(--accent); animation:pulse 1s ease-in-out infinite;}
  .sync-pill[data-state="local"] .sync-dot{background:var(--text-faint);}
  .sync-pill[data-state="error"] .sync-dot{background:var(--gr-s);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .progress-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:12px;
  }
  .progress-track{
    flex:1;
    height:7px;
    border-radius:4px;
    background:var(--surface-2);
    border:1px solid var(--border);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    width:0%;
    transition:width .25s ease;
  }
  .progress-label{
    font-family:"IBM Plex Mono",monospace;
    font-size:13px;
    font-variant-numeric:tabular-nums;
    color:var(--text-dim);
    white-space:nowrap;
  }
  .progress-label b{color:var(--text); font-weight:600;}

  .header-slim{
    display:flex;
    align-items:center;
    gap:9px;
    width:100%;
    padding:2px 2px;
    background:none;
    border:none;
    cursor:pointer;
    text-align:left;
  }
  .header-slim-dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--text-faint);
    flex:none;
  }
  .header-slim-dot.synced{background:var(--el-strand);}
  .header-slim-dot.syncing{background:var(--accent); animation:pulse 1s ease-in-out infinite;}
  .header-slim-dot.error{background:var(--gr-s);}
  .header-slim-title{
    font-family:"Big Shoulders","Work Sans",sans-serif;
    font-weight:800;
    font-size:19px;
    letter-spacing:.01em;
    color:var(--text);
  }
  .header-slim-progress{
    margin-left:auto;
    font-family:"IBM Plex Mono",monospace;
    font-size:12px;
    font-variant-numeric:tabular-nums;
    color:var(--text-faint);
  }
  .header-slim-progress b{color:var(--text-dim); font-weight:600;}
  .header-slim-chevron{
    color:var(--text-faint);
    transition:transform .15s ease;
    flex:none;
  }
  .header-slim.collapsed .header-slim-chevron{transform:rotate(-90deg);}
  .header-full{
    margin-top:8px;
  }
  .header-full.collapsed{display:none;}
  .controls{
    margin-top:14px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .search-wrap{
    position:relative;
  }
  .search-wrap input{
    width:100%;
    padding:9px 96px 9px 32px;
    border-radius:var(--radius-sm);
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--text);
    font-family:"Work Sans",sans-serif;
    font-size:14px;
  }
  .search-wrap input:focus{
    outline:2px solid var(--accent);
    outline-offset:-1px;
  }
  .name-only-toggle{
    position:absolute;
    right:6px;
    top:50%;
    transform:translateY(-50%);
    font-family:"IBM Plex Mono",monospace;
    font-size:10.5px;
    letter-spacing:.03em;
    padding:4px 8px;
    border-radius:999px;
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--text-faint);
    cursor:pointer;
    white-space:nowrap;
  }
  .name-only-toggle:hover{border-color:var(--accent); color:var(--text-dim);}
  .name-only-toggle.active{
    background:var(--text);
    border-color:var(--text);
    color:var(--bg);
  }
  .search-wrap svg{
    position:absolute;
    left:10px;
    top:50%;
    transform:translateY(-50%);
    width:14px;height:14px;
    color:var(--text-faint);
  }
  .chip-scroller{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:2px;
  }
  .chip-scroller::-webkit-scrollbar{height:4px;}
  .chip-group{
    display:flex;
    gap:6px;
    flex:none;
  }
  .chip-sep{
    width:1px;
    background:var(--border);
    margin:2px 2px;
    flex:none;
  }
  button.chip{
    flex:none;
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-family:"IBM Plex Mono",monospace;
    font-size:11.5px;
    letter-spacing:.03em;
    padding:5px 10px;
    border-radius:999px;
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--text-dim);
    cursor:pointer;
    white-space:nowrap;
  }
  button.chip:hover{border-color:var(--accent);}
  button.chip.active{
    background:var(--text);
    border-color:var(--text);
    color:var(--bg);
  }
  button.chip .dot{
    width:8px;height:8px;border-radius:50%;
    flex:none;
  }
  .pop-legend{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:12px;
    font-size:11px;
    color:var(--text-faint);
    padding:2px 2px 0;
  }
  .pop-legend-item{
    display:inline-flex;
    align-items:center;
    gap:5px;
  }
  .pop-legend .dot{
    width:8px;height:8px;border-radius:50%;
    flex:none;
    box-shadow:0 0 0 1px rgba(0,0,0,.15) inset;
  }
  button.chip:focus-visible, a:focus-visible, input:focus-visible, .row:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }

  main{
    max-width:760px;
    margin:0 auto;
    padding:14px 18px 60px;
  }

  .section{
    margin-top:18px;
  }
  .section-head{
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    padding:6px 2px;
    user-select:none;
  }
  .grade-badge{
    font-family:"Big Shoulders",sans-serif;
    font-weight:800;
    font-size:15px;
    color:#fff;
    width:26px;height:26px;
    border-radius:7px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:none;
  }
  .section-title{
    font-family:"Big Shoulders",sans-serif;
    font-weight:700;
    font-size:16px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--text);
  }
  .section-count{
    font-family:"IBM Plex Mono",monospace;
    font-size:12px;
    color:var(--text-faint);
    font-variant-numeric:tabular-nums;
  }
  .section-chevron{
    margin-left:auto;
    color:var(--text-faint);
    transition:transform .15s ease;
    flex:none;
  }
  .section.collapsed .section-chevron{transform:rotate(-90deg);}
  .section-body{
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    background:var(--surface);
    overflow:hidden;
    box-shadow:var(--shadow);
  }
  .section.collapsed .section-body{display:none;}

  .row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:10px 12px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .row:last-child{border-bottom:none;}
  .row:hover{background:var(--surface-2);}
  .row.owned{background:color-mix(in srgb, var(--accent-soft) 55%, transparent);}
  .row.owned:hover{background:var(--accent-soft);}
  .row.tier-basic{background:color-mix(in srgb, var(--tier-basic) 16%, var(--surface)); box-shadow:inset 2px 0 0 var(--tier-basic);}
  .row.tier-basic:hover{background:color-mix(in srgb, var(--tier-basic) 24%, var(--surface));}
  .row.tier-good{background:color-mix(in srgb, var(--tier-good) 18%, var(--surface)); box-shadow:inset 2px 0 0 var(--tier-good);}
  .row.tier-good:hover{background:color-mix(in srgb, var(--tier-good) 26%, var(--surface));}
  .row.tier-god{background:color-mix(in srgb, var(--tier-god) 18%, var(--surface)); box-shadow:inset 2px 0 0 var(--tier-god);}
  .row.tier-god:hover{background:color-mix(in srgb, var(--tier-god) 26%, var(--surface));}
  .row[hidden]{display:none;}

  .row-flag-badge{
    font-family:"IBM Plex Mono",monospace;
    font-size:10px;
    letter-spacing:.04em;
    padding:1px 7px;
    border-radius:999px;
    white-space:nowrap;
  }
  .row-flag-badge.basic{
    color:var(--tier-basic-ink);
    background:var(--tier-basic);
    border:1px solid var(--tier-basic);
  }
  .row-flag-badge.good{
    color:var(--tier-good-ink);
    background:var(--tier-good);
    border:1px solid var(--tier-good);
  }
  .row-flag-badge.god{
    color:var(--tier-god-ink);
    background:var(--tier-god);
    border:1px solid var(--tier-god);
  }

  .row-check{
    flex:none;
    margin-top:2px;
    width:19px;height:19px;
    cursor:pointer;
    accent-color:var(--accent);
  }
  .row-rail{
    width:4px;
    align-self:stretch;
    border-radius:3px;
    flex:none;
  }
  .row-main{
    flex:1;
    min-width:0;
  }
  .row-name-line{
    display:flex;
    align-items:baseline;
    gap:8px;
    flex-wrap:wrap;
  }
  .row-name{
    font-weight:600;
    font-size:14.5px;
    color:var(--text);
  }
  .row.edited .row-name{color:var(--accent);}
  .row.tier-basic .row-name{color:var(--tier-basic);}
  .row.tier-good .row-name{color:var(--tier-good);}
  .row.tier-god .row-name{color:var(--tier-god);}
  .craft-icon{
    display:inline-flex;
    color:var(--text-faint);
    flex:none;
  }
  .craft-icon svg{width:12px;height:12px;}
  .row.edited .craft-icon{color:var(--accent);}
  .row.tier-basic .craft-icon{color:var(--tier-basic);}
  .row.tier-good .craft-icon{color:var(--tier-good);}
  .row.tier-god .craft-icon{color:var(--tier-god);}
  .row-meta{
    font-size:12.5px;
    color:var(--text-dim);
    margin-top:2px;
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    align-items:center;
  }
  .row-meta .sep{color:var(--text-faint);}
  .el-dot{
    width:8px;height:8px;border-radius:50%;
    display:inline-block;
    flex:none;
  }
  .row-grade{
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;
    font-weight:600;
    color:#fff;
    width:20px;height:20px;
    border-radius:5px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:none;
    margin-top:1px;
  }
  .row-detail{
    margin-top:8px;
    display:none;
  }
  .row.expanded .row-detail{display:block;}

  .row-notes{
    padding:9px 11px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    font-size:13px;
    line-height:1.5;
    color:var(--text-dim);
  }

  .roll-block{
    margin-top:8px;
    padding:10px 11px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
  }
  .roll-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:8px;
  }
  .roll-title{
    font-family:"IBM Plex Mono",monospace;
    font-size:10.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--text-faint);
  }
  .roll-focus{
    font-family:"IBM Plex Mono",monospace;
    font-size:10.5px;
    color:var(--accent);
    border:1px solid var(--accent);
    border-radius:999px;
    padding:2px 8px;
    white-space:nowrap;
  }
  .roll-focus-wrap{
    display:inline-flex;
    align-items:center;
    gap:5px;
    cursor:pointer;
  }
  .roll-focus-check{
    width:14px;height:14px;
    accent-color:var(--accent);
    cursor:pointer;
    flex:none;
  }
  .roll-cols{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px 14px;
  }
  .roll-col-label{
    font-family:"IBM Plex Mono",monospace;
    font-size:10px;
    color:var(--text-faint);
    letter-spacing:.06em;
    display:block;
    margin-bottom:3px;
  }
  .roll-opts{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:4px;
    font-size:12.5px;
  }
  .roll-pill{
    background:var(--surface);
    border:1px solid var(--border-strong);
    border-radius:5px;
    padding:2px 7px;
    color:var(--text);
    font-weight:500;
    font-family:inherit;
    font-size:inherit;
  }
  .roll-pill.selectable{
    cursor:pointer;
  }
  .roll-pill.selectable:hover{
    border-color:var(--accent);
  }
  .roll-pill.selectable.selected{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--accent-ink);
    font-weight:600;
  }
  .roll-pill.pop-1{box-shadow:0 0 0 2px var(--pop-1) inset;}
  .roll-pill.pop-2{box-shadow:0 0 0 2px var(--pop-2) inset;}
  .roll-pill.pop-3{box-shadow:0 0 0 2px var(--pop-3) inset;}
  .roll-or{
    color:var(--text-faint);
    font-size:11px;
    font-style:italic;
  }
  .roll-origin{
    margin-top:10px;
    padding-top:9px;
    border-top:1px dashed var(--border);
    display:flex;
    align-items:baseline;
    gap:8px;
    font-size:12.5px;
  }
  .roll-origin .roll-col-label{margin-bottom:0;}
  .roll-origin .roll-pill{border-color:var(--accent); color:var(--accent);}
  .mod-input{
    flex:1;
    min-width:0;
    max-width:220px;
    padding:3px 8px;
    border-radius:5px;
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--text);
    font-family:"Work Sans",sans-serif;
    font-size:12.5px;
  }
  .mod-input:focus{
    outline:2px solid var(--accent);
    outline-offset:-1px;
  }
  .mod-input-auto{
    color:var(--text-dim);
    font-style:italic;
    border-style:dashed;
  }
  .mod-auto-tag{
    font-family:"IBM Plex Mono",monospace;
    font-size:9.5px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--text-faint);
    white-space:nowrap;
  }
  .roll-flags{
    display:flex;
    gap:8px;
    margin-top:10px;
    flex-wrap:wrap;
  }
  .flag-btn{
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;
    padding:5px 10px;
    border-radius:6px;
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--text-dim);
    cursor:pointer;
  }
  .flag-btn:hover{border-color:var(--accent);}
  .flag-btn.flag-basic.active{
    background:var(--tier-basic);
    border-color:var(--tier-basic);
    color:var(--tier-basic-ink);
  }
  .flag-btn.flag-good.active{
    background:var(--tier-good);
    border-color:var(--tier-good);
    color:var(--tier-good-ink);
  }
  .flag-btn.flag-god.active{
    background:var(--tier-god);
    border-color:var(--tier-god);
    color:var(--tier-god-ink);
  }
  @media (max-width:420px){
    .roll-cols{grid-template-columns:1fr;}
  }

  .empty-state{
    text-align:center;
    color:var(--text-faint);
    font-size:13.5px;
    padding:40px 12px;
  }

  footer.foot{
    max-width:760px;
    margin:0 auto;
    padding:0 18px 40px;
    color:var(--text-faint);
    font-size:12px;
    font-family:"IBM Plex Mono",monospace;
  }

const GRADE_ORDER = ['S','A','B','C','D','E','F'];
const GRADE_VAR = {S:'--gr-s',A:'--gr-a',B:'--gr-b',C:'--gr-c',D:'--gr-d',E:'--gr-e',F:'--gr-f'};
const ELEMENTS = ['Kinetic','Arc','Solar','Void','Stasis','Strand'];
const ELEMENT_VAR = {Kinetic:'--el-kinetic',Arc:'--el-arc',Solar:'--el-solar',Void:'--el-void',Stasis:'--el-stasis',Strand:'--el-strand'};

const DEFAULT_RECORD = { owned:false, rollTier:'none', mod:'', hasFocus:false, autoGod:false, perk0:[], perk1:[], perk2:[], perk3:[] };
const ROLL_TIERS = ['basic','good','god'];
const PERK_KEYS = ['perk0','perk1','perk2','perk3'];

const state = {
  records: {},              // id(string) -> {owned,rollTier,mod,perk0..perk3}
  query: '',
  nameOnly: false,
  elements: new Set(ELEMENTS),
  status: 'all',             // all | owned | unowned | basic | good | god
  collapsed: new Set(['C','D','E','F']),
  expanded: new Set(),       // id(string) -> manually expanded
};

function isExpanded(id){
  return state.query.length > 0 || state.expanded.has(String(id));
}

function getRecord(id){
  const key = String(id);
  return state.records[key] || DEFAULT_RECORD;
}
function setRecord(id, patch){
  const key = String(id);
  const cur = state.records[key] || { ...DEFAULT_RECORD };
  state.records[key] = { ...cur, ...patch };
  if (!Object.hasOwn(patch, "scan")) delete state.records[key].scan;
  return state.records[key];
}

WEAPONS.forEach(w => { if(w.owned) setRecord(w.id, { owned: true }); });

let dbRef = null;
let localOnly = true;

function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

// normalize a raw stored value (legacy boolean, legacy {good,god} object, or
// the current {owned,rollTier,mod} shape) into a full current-shape record
function normalizeRecord(raw){
  if(raw === true) return { ...DEFAULT_RECORD, owned:true };
  if(raw && typeof raw === 'object'){
    let rollTier = 'none';
    if(typeof raw.rollTier === 'string' && ROLL_TIERS.includes(raw.rollTier)){
      rollTier = raw.rollTier;
    }else if(raw.god){
      rollTier = 'god';
    }else if(raw.good){
      rollTier = 'good';
    }
    const rec = {
      owned: !!raw.owned,
      rollTier,
      mod: typeof raw.mod === 'string' ? raw.mod : '',
      hasFocus: !!raw.hasFocus,
      autoGod: !!raw.autoGod,
      scan: raw.scan?.source === "bungie" ? JSON.parse(JSON.stringify(raw.scan)) : undefined,
    };
    PERK_KEYS.forEach(k => {
      if(Array.isArray(raw[k])){
        rec[k] = raw[k].filter(s => typeof s === 'string');
      }else if(typeof raw[k] === 'string' && raw[k]){
        // migrate the older single-select field
        rec[k] = [raw[k]];
      }else{
        rec[k] = [];
      }
    });
    return rec;
  }
  return { ...DEFAULT_RECORD };
}

// ---------- persistence ----------
function loadLocal(){
  try{
    const raw = localStorage.getItem('weaponVaultRecords');
    if(raw){
      const obj = JSON.parse(raw);
      Object.keys(obj).forEach(k => { state.records[k] = normalizeRecord(obj[k]); });
      return;
    }
    // migrate from the older boolean-only format
    const legacy = localStorage.getItem('weaponVaultOwned');
    if(legacy){
      const obj = JSON.parse(legacy);
      Object.keys(obj).forEach(k => { if(obj[k]) setRecord(k, { owned: true }); });
    }
  }catch(e){}
}
function saveLocal(){
  try{ localStorage.setItem('weaponVaultRecords', JSON.stringify(state.records)); }catch(e){}
}

function setSync(mode){
  const pill = document.getElementById('syncPill');
  const label = document.getElementById('syncLabel');
  pill.dataset.state = mode;
  const labels = {
    local: 'Saved on this device',
    syncing: 'Syncing…',
    synced: 'Synced to your account',
    error: 'Sync error — saved locally',
  };
  label.textContent = labels[mode] || mode;
  const mini = document.getElementById('syncDotMini');
  if(mini) mini.className = 'header-slim-dot' + (mode ? ' ' + mode : '');
}

async function initDb(){
  loadLocal();
  renderAll();

  let db = null;
  try{
    db = window.claude && window.claude.use ? await window.claude.use('db') : null;
  }catch(e){ db = null; }

  if(!db){
    setSync('local');
    localOnly = true;
    return;
  }

  localOnly = false;
  dbRef = db.doc('state/owned');

  try{
    const snap = await dbRef.get();
    if(!snap.exists){
      const seed = {};
      WEAPONS.forEach(w => { if(w.owned) seed[String(w.id)] = { owned: true, rollTier: 'none', mod: '' }; });
      await dbRef.set(seed);
    }
  }catch(e){
    setSync('error');
  }

  dbRef.onSnapshot(snap => {
    const data = snap.data() || {};
    Object.keys(data).forEach(key => {
      state.records[key] = normalizeRecord(data[key]);
    });
    setSync(snap.metadata && snap.metadata.hasPendingWrites ? 'syncing' : 'synced');
    renderAll();
  }, err => {
    setSync('error');
  });
}

function pushRecord(id, patch){
  saveLocal();
  if(dbRef){
    setSync('syncing');
    dbRef.update({ [String(id)]: patch }).catch(() => setSync('error'));
  }
}

function afterRecordChange(w){
  updateProgress();
  if(state.status !== 'all'){
    renderAll();
  }else{
    replaceRow(w);
  }
}

function toggleOwned(w){
  const rec = getRecord(w.id);
  let patch;
  if(rec.owned){
    // dropping ownership drops any roll-quality tier with it
    patch = { owned: false, rollTier: 'none' };
  }else{
    patch = { owned: true };
  }
  setRecord(w.id, patch);
  pushRecord(w.id, patch);
  afterRecordChange(w);
}

function setRollTier(w, tier){
  const rec = getRecord(w.id);
  const patch = rec.rollTier === tier
    ? { rollTier: 'none', autoGod: false }
    : { rollTier: tier, owned: true, autoGod: false };
  setRecord(w.id, patch);
  pushRecord(w.id, patch);
  afterRecordChange(w);
}

function setMod(w, text){
  const patch = { mod: text };
  setRecord(w.id, patch);
  pushRecord(w.id, patch);
}

// if patch fills the last empty perk column, or checks the priority-mod box,
// while every other required condition already holds, auto-flag the roll as
// god-tier; if a later change breaks one of those conditions and the god tier
// was set by this auto behavior (not a manual "Mark God Roll" click), revert it
function mergeAutoGod(prevRec, patch){
  const next = { ...prevRec, ...patch };
  const allColsFilled = PERK_KEYS.every(k => next[k].length > 0);
  const shouldBeGod = allColsFilled && next.hasFocus;
  if(shouldBeGod && next.rollTier !== 'god'){
    return { ...patch, rollTier: 'god', owned: true, autoGod: true };
  }
  if(!shouldBeGod && prevRec.autoGod && next.rollTier === 'god'){
    return { ...patch, rollTier: 'none', autoGod: false };
  }
  return patch;
}

function toggleFocus(w){
  const rec = getRecord(w.id);
  const patch = mergeAutoGod(rec, { hasFocus: !rec.hasFocus });
  setRecord(w.id, patch);
  pushRecord(w.id, patch);
  afterRecordChange(w);
}

function setPerk(w, colIndex, perkName){
  const rec = getRecord(w.id);
  const key = PERK_KEYS[colIndex];
  const has = rec[key].includes(perkName);
  const next = has ? rec[key].filter(s => s !== perkName) : [...rec[key], perkName];
  const patch = mergeAutoGod(rec, { [key]: next });
  setRecord(w.id, patch);
  pushRecord(w.id, patch);
  afterRecordChange(w);
}

// ---------- rendering ----------
function matchesFilters(w){
  const rec = getRecord(w.id);
  if(state.status === 'owned' && !rec.owned) return false;
  if(state.status === 'unowned' && rec.owned) return false;
  if(state.status === 'basic' && rec.rollTier !== 'basic') return false;
  if(state.status === 'good' && rec.rollTier !== 'good') return false;
  if(state.status === 'god' && rec.rollTier !== 'god') return false;
  if(state.status === 'craftable' && w.craftable !== 'Yes') return false;
  if(!state.elements.has(w.element)) return false;
  if(state.query){
    let hay;
    if(state.nameOnly){
      hay = w.name.toLowerCase();
    }else{
      const perkText = (w.rollCols || []).flat().join(' ');
      const modText = rec.mod || w.recommendedMod || '';
      hay = (w.name + ' ' + w.archetype + ' ' + w.source + ' ' + w.notes + ' ' + perkText + ' ' + (w.origin || '') + ' ' + modText).toLowerCase();
    }
    if(!hay.includes(state.query)) return false;
  }
  return true;
}

function buildRollBlock(w){
  const rec = getRecord(w.id);
  const block = document.createElement('div');
  block.className = 'roll-block';

  const head = document.createElement('div');
  head.className = 'roll-head';
  const title = document.createElement('span');
  title.className = 'roll-title';
  title.textContent = 'Recommended Roll';
  head.appendChild(title);
  if(w.statFocus){
    const focusWrap = document.createElement('label');
    focusWrap.className = 'roll-focus-wrap';
    focusWrap.addEventListener('click', e => e.stopPropagation());
    const focusCheck = document.createElement('input');
    focusCheck.type = 'checkbox';
    focusCheck.className = 'roll-focus-check';
    focusCheck.checked = rec.hasFocus;
    focusCheck.setAttribute('aria-label', 'Mark priority stat as obtained on your roll');
    focusCheck.addEventListener('change', () => toggleFocus(w));
    focusWrap.appendChild(focusCheck);
    const focus = document.createElement('span');
    focus.className = 'roll-focus';
    focus.textContent = 'Priority: ' + w.statFocus;
    focusWrap.appendChild(focus);
    head.appendChild(focusWrap);
  }
  block.appendChild(head);

  if(w.rollCols && w.rollCols.length){
    const grid = document.createElement('div');
    grid.className = 'roll-cols';
    const rankedCols = w.rollColsRanked || w.rollCols.map(col => col.map(name => ({name, pct: null})));
    rankedCols.forEach((opts, i) => {
      const colWrap = document.createElement('div');
      const label = document.createElement('span');
      label.className = 'roll-col-label';
      label.textContent = 'Col ' + (i + 1);
      colWrap.appendChild(label);
      const optsWrap = document.createElement('div');
      optsWrap.className = 'roll-opts';
      let popRank = 0;
      opts.forEach((opt, j) => {
        if(j > 0){
          const or = document.createElement('span');
          or.className = 'roll-or';
          or.textContent = 'or';
          optsWrap.appendChild(or);
        }
        const isSelected = rec[PERK_KEYS[i]].includes(opt.name);
        const pill = document.createElement('button');
        pill.type = 'button';
        let cls = 'roll-pill selectable' + (isSelected ? ' selected' : '');
        if(opt.pct !== null && opt.pct !== undefined){
          popRank++;
          if(popRank <= 3) cls += ' pop-' + popRank;
        }
        pill.className = cls;
        pill.textContent = (isSelected ? '✓ ' : '') + opt.name;
        pill.title = 'Mark every perk you have in Col ' + (i + 1) +
          (opt.pct !== null && opt.pct !== undefined ? ' — ' + opt.pct + '% of community rolls (light.gg)' : '');
        pill.addEventListener('click', e => { e.stopPropagation(); setPerk(w, i, opt.name); });
        optsWrap.appendChild(pill);
      });
      colWrap.appendChild(optsWrap);
      grid.appendChild(colWrap);
    });
    block.appendChild(grid);
  }

  if(w.archetype){
    const archRow = document.createElement('div');
    archRow.className = 'roll-origin';
    const label = document.createElement('span');
    label.className = 'roll-col-label';
    label.textContent = 'Archetype';
    archRow.appendChild(label);
    const pill = document.createElement('span');
    pill.className = 'roll-pill';
    pill.textContent = w.archetype;
    archRow.appendChild(pill);
    block.appendChild(archRow);
  }

  if(w.origin){
    const originRow = document.createElement('div');
    originRow.className = 'roll-origin';
    const label = document.createElement('span');
    label.className = 'roll-col-label';
    label.textContent = 'Origin';
    originRow.appendChild(label);
    const pill = document.createElement('span');
    pill.className = 'roll-pill';
    pill.textContent = w.origin;
    originRow.appendChild(pill);
    block.appendChild(originRow);
  }

  const modRow = document.createElement('div');
  modRow.className = 'roll-origin';
  const modLabel = document.createElement('span');
  modLabel.className = 'roll-col-label';
  modLabel.textContent = 'Mod';
  modRow.appendChild(modLabel);
  const modInput = document.createElement('input');
  modInput.type = 'text';
  modInput.className = 'mod-input';
  modInput.placeholder = 'no data yet — add one';
  const usingAuto = !rec.mod && !!w.recommendedMod;
  modInput.value = rec.mod || w.recommendedMod || '';
  if(usingAuto){
    modInput.classList.add('mod-input-auto');
    modInput.title = 'From light.gg Mod Popularity (most-used pick) — edit to override';
  }
  modInput.setAttribute('aria-label', 'Recommended mod for ' + w.name);
  modInput.addEventListener('click', e => e.stopPropagation());
  modInput.addEventListener('change', () => setMod(w, modInput.value.trim()));
  modRow.appendChild(modInput);
  if(usingAuto){
    const autoTag = document.createElement('span');
    autoTag.className = 'mod-auto-tag';
    autoTag.textContent = 'light.gg pick';
    modRow.appendChild(autoTag);
  }
  block.appendChild(modRow);

  const flagRow = document.createElement('div');
  flagRow.className = 'roll-flags';

  const basicBtn = document.createElement('button');
  basicBtn.type = 'button';
  basicBtn.className = 'flag-btn flag-basic' + (rec.rollTier === 'basic' ? ' active' : '');
  basicBtn.textContent = rec.rollTier === 'basic' ? '✓ Basic Roll' : 'Mark Basic Roll';
  basicBtn.title = 'Basic roll: you have it, but not the recommended perks';
  basicBtn.addEventListener('click', e => { e.stopPropagation(); setRollTier(w, 'basic'); });
  flagRow.appendChild(basicBtn);

  const goodBtn = document.createElement('button');
  goodBtn.type = 'button';
  goodBtn.className = 'flag-btn flag-good' + (rec.rollTier === 'good' ? ' active' : '');
  goodBtn.textContent = rec.rollTier === 'good' ? '✓ Good Roll' : 'Mark Good Roll';
  goodBtn.title = 'Good roll: you have the recommended Col 3 + Col 4 perks';
  goodBtn.addEventListener('click', e => { e.stopPropagation(); setRollTier(w, 'good'); });
  flagRow.appendChild(goodBtn);

  const godBtn = document.createElement('button');
  godBtn.type = 'button';
  godBtn.className = 'flag-btn flag-god' + (rec.rollTier === 'god' ? ' active' : '');
  godBtn.textContent = rec.rollTier === 'god' ? '★ God Roll' : 'Mark God Roll';
  godBtn.title = 'God roll: you have the full recommended roll, all columns';
  godBtn.addEventListener('click', e => { e.stopPropagation(); setRollTier(w, 'god'); });
  flagRow.appendChild(godBtn);

  block.appendChild(flagRow);

  return block;
}

function buildRow(w){
  const key = String(w.id);
  const rec = getRecord(w.id);

  const row = document.createElement('div');
  const tierClass = rec.rollTier !== 'none' ? ' tier-' + rec.rollTier : '';
  const edited = rec.owned || rec.rollTier !== 'none' || !!rec.mod || rec.hasFocus || PERK_KEYS.some(k => rec[k].length > 0);
  row.className = 'row' + (rec.owned ? ' owned' : '') + tierClass + (edited ? ' edited' : '') + (isExpanded(key) ? ' expanded' : '');
  row.dataset.id = key;

  const rail = document.createElement('div');
  rail.className = 'row-rail';
  rail.style.background = `var(${ELEMENT_VAR[w.element] || '--el-kinetic'})`;
  row.appendChild(rail);

  const check = document.createElement('input');
  check.type = 'checkbox';
  check.className = 'row-check';
  check.checked = rec.owned;
  check.setAttribute('aria-label', 'Mark ' + w.name + ' as owned');
  check.addEventListener('click', e => e.stopPropagation());
  check.addEventListener('change', () => toggleOwned(w));
  row.appendChild(check);

  const mainWrap = document.createElement('div');
  mainWrap.style.display = 'flex';
  mainWrap.style.flex = '1';
  mainWrap.style.gap = '8px';
  mainWrap.style.minWidth = '0';
  mainWrap.style.alignItems = 'flex-start';

  const main = document.createElement('div');
  main.className = 'row-main';

  const nameLine = document.createElement('div');
  nameLine.className = 'row-name-line';
  const name = document.createElement('span');
  name.className = 'row-name';
  name.textContent = w.name;
  nameLine.appendChild(name);
  if(w.craftable === 'Yes'){
    const craftIcon = document.createElement('span');
    craftIcon.className = 'craft-icon';
    craftIcon.title = 'Craftable — can be guaranteed via pattern + resources';
    craftIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>';
    nameLine.appendChild(craftIcon);
  }
  main.appendChild(nameLine);

  const meta = document.createElement('div');
  meta.className = 'row-meta';
  const elDot = document.createElement('span');
  elDot.className = 'el-dot';
  elDot.style.background = `var(${ELEMENT_VAR[w.element] || '--el-kinetic'})`;
  meta.appendChild(elDot);
  const elLabel = document.createElement('span');
  elLabel.textContent = w.element + (w.archetype ? ' ' + w.archetype : '');
  meta.appendChild(elLabel);
  const sep = document.createElement('span');
  sep.className = 'sep';
  sep.textContent = '·';
  meta.appendChild(sep);
  const src = document.createElement('span');
  src.textContent = w.source;
  meta.appendChild(src);
  const TIER_BADGE = { basic: 'Basic Roll', good: 'Good Roll', god: '★ God Roll' };
  if(TIER_BADGE[rec.rollTier]){
    const badge = document.createElement('span');
    badge.className = 'row-flag-badge ' + rec.rollTier;
    badge.textContent = TIER_BADGE[rec.rollTier];
    meta.appendChild(badge);
  }
  main.appendChild(meta);
  if (rec.scan?.instanceId) {
    const provenance = document.createElement('div');
    provenance.className = 'scan-provenance';
    provenance.textContent = 'Bungie copy ' + rec.scan.instanceId + ' · ' + rec.scan.location;
    main.appendChild(provenance);
  }

  const detail = document.createElement('div');
  detail.className = 'row-detail';

  if(w.notes){
    const notes = document.createElement('div');
    notes.className = 'row-notes';
    notes.textContent = w.notes;
    detail.appendChild(notes);
  }

  if((w.rollCols && w.rollCols.length) || w.origin){
    detail.appendChild(buildRollBlock(w));
  }

  main.appendChild(detail);

  mainWrap.appendChild(main);

  const grade = document.createElement('span');
  grade.className = 'row-grade';
  grade.textContent = w.grade;
  grade.style.background = `var(${GRADE_VAR[w.grade] || '--gr-c'})`;
  mainWrap.appendChild(grade);

  row.appendChild(mainWrap);

  row.addEventListener('click', () => {
    if(state.expanded.has(key)) state.expanded.delete(key);
    else state.expanded.add(key);
    row.classList.toggle('expanded', isExpanded(key));
  });

  return row;
}

function renderAll(){
  const sectionsEl = document.getElementById('sections');
  sectionsEl.innerHTML = '';

  const q = state.query;
  let anyVisible = false;
  let totalMatched = 0;

  GRADE_ORDER.forEach(grade => {
    const items = WEAPONS.filter(w => w.grade === grade && matchesFilters(w));
    if(items.length === 0) return;
    totalMatched += items.length;
    anyVisible = true;

    const section = document.createElement('div');
    section.className = 'section' + (state.collapsed.has(grade) ? ' collapsed' : '');
    section.dataset.grade = grade;

    const ownedInSection = items.reduce((n, w) => n + (getRecord(w.id).owned ? 1 : 0), 0);

    const head = document.createElement('div');
    head.className = 'section-head';
    head.innerHTML = `
      <span class="grade-badge" style="background:var(${GRADE_VAR[grade]})">${grade}</span>
      <span class="section-title">${grade} Tier</span>
      <span class="section-count">${ownedInSection} / ${items.length}</span>
      <svg class="section-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
    `;
    head.addEventListener('click', () => {
      if(state.collapsed.has(grade)) state.collapsed.delete(grade);
      else state.collapsed.add(grade);
      section.classList.toggle('collapsed');
    });
    section.appendChild(head);

    const body = document.createElement('div');
    body.className = 'section-body';
    items.forEach(w => body.appendChild(buildRow(w)));
    section.appendChild(body);

    sectionsEl.appendChild(section);
  });

  document.getElementById('emptyState').hidden = anyVisible;
  updateProgress();
}

function replaceRow(w){
  const key = String(w.id);
  const old = document.querySelector('.row[data-id="' + key + '"]');
  if(!old) return;
  const fresh = buildRow(w);
  old.replaceWith(fresh);
  updateSectionCount(w.grade);
}

function updateSectionCount(grade){
  const section = document.querySelector('.section[data-grade="' + grade + '"]');
  if(!section) return;
  const countEl = section.querySelector('.section-count');
  const total = section.querySelectorAll('.row').length;
  const ownedN = section.querySelectorAll('.row.owned').length;
  if(countEl) countEl.textContent = ownedN + ' / ' + total;
}

function updateProgress(){
  const total = WEAPONS.length;
  const owned = WEAPONS.reduce((n, w) => n + (getRecord(w.id).owned ? 1 : 0), 0);
  document.getElementById('ownedCount').textContent = owned;
  document.getElementById('totalCount').textContent = total;
  document.getElementById('ownedCountMini').textContent = owned;
  document.getElementById('totalCountMini').textContent = total;
  document.getElementById('footTotal').textContent = total;
  document.getElementById('progressFill').style.width = (total ? (owned / total * 100) : 0).toFixed(1) + '%';
}

// ---------- controls ----------
function buildElementChips(){
  const wrap = document.getElementById('elementChips');
  wrap.innerHTML = '';
  ELEMENTS.forEach(el => {
    const btn = document.createElement('button');
    btn.className = 'chip active';
    btn.dataset.element = el;
    btn.innerHTML = `<span class="dot" style="background:var(${ELEMENT_VAR[el]})"></span>${el}`;
    btn.addEventListener('click', () => {
      if(state.elements.has(el)){
        state.elements.delete(el);
        btn.classList.remove('active');
      }else{
        state.elements.add(el);
        btn.classList.add('active');
      }
      renderAll();
    });
    wrap.appendChild(btn);
  });
}

function wireControls(){
  const headerToggle = document.getElementById('headerToggle');
  const headerFull = document.getElementById('headerFull');
  let headerCollapsed = false;
  try{ headerCollapsed = localStorage.getItem('weaponVaultHeaderCollapsed') === '1'; }catch(e){}
  const applyHeaderState = () => {
    headerToggle.classList.toggle('collapsed', headerCollapsed);
    headerFull.classList.toggle('collapsed', headerCollapsed);
  };
  applyHeaderState();
  headerToggle.addEventListener('click', () => {
    headerCollapsed = !headerCollapsed;
    applyHeaderState();
    try{ localStorage.setItem('weaponVaultHeaderCollapsed', headerCollapsed ? '1' : '0'); }catch(e){}
  });

  document.getElementById('searchInput').addEventListener('input', e => {
    state.query = e.target.value.trim().toLowerCase();
    renderAll();
  });

  document.getElementById('nameOnlyToggle').addEventListener('click', e => {
    state.nameOnly = !state.nameOnly;
    e.currentTarget.classList.toggle('active', state.nameOnly);
    if(state.query) renderAll();
  });

  document.getElementById('statusChips').addEventListener('click', e => {
    const btn = e.target.closest('button.chip');
    if(!btn) return;
    if(btn.dataset.status){
      state.status = btn.dataset.status;
      [...document.querySelectorAll('#statusChips [data-status]')].forEach(b => b.classList.toggle('active', b === btn));
      renderAll();
    }else if(btn.dataset.action === 'expand'){
      state.collapsed.clear();
      renderAll();
    }else if(btn.dataset.action === 'collapse'){
      GRADE_ORDER.forEach(g => state.collapsed.add(g));
      renderAll();
    }
  });
}

buildElementChips();
wireControls();
initDb().then(() => VaultBungieUI.mount({
  catalog: {kind:'weapon',weapons:WEAPONS}, storageKey: 'weaponVaultRecords',
  getRecords: () => state.records, normalize: normalizeRecord,
  replaceRecords: async records => {
    const normalized = Object.fromEntries(Object.entries(records).map(([id,record]) => [id,normalizeRecord(record)]));
    localStorage.setItem('weaponVaultRecords', JSON.stringify(normalized));
    state.records = normalized;
    renderAll();
    if (dbRef) {
      try { await dbRef.update(normalized); }
      catch { throw new Error('Checklist saved locally, but cloud sync failed. Export a backup before reconnecting.'); }
    }
  }
}));
</script>
